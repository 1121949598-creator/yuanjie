version: "2026.09.09"
rules:
  - id: secret.private-key
    description: Private key material
    secret_type: private_key
    severity: critical
    confidence: 0.95
    pattern: '-----BEGIN (?P<kind>(?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY)-----(?:[\s\S]*?-----END (?P=kind)-----|(?:\r?\n[ \t]*[A-Za-z0-9+/=]{16,}[ \t]*)*)'
  - id: secret.aws-access-key
    description: AWS access key identifier
    secret_type: aws_access_key
    severity: high
    confidence: 0.95
    pattern: '\b(?P<secret>AKIA[0-9A-Z]{16})\b'
  - id: secret.github-token
    description: GitHub access token
    secret_type: api_key
    severity: high
    confidence: 0.9
    pattern: '\b(?P<secret>gh[pousr]_[A-Za-z0-9]{30,255})\b'
  - id: secret.openai-key
    description: OpenAI-style API key
    secret_type: api_key
    severity: high
    confidence: 0.9
    pattern: '\b(?P<secret>sk-[A-Za-z0-9_-]{20,})\b'
  - id: secret.jwt
    description: Potential JSON Web Token (not signature-verified)
    secret_type: jwt
    severity: medium
    confidence: 0.65
    validator: jwt
    pattern: '\b(?P<secret>eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b'
  - id: secret.database-url
    description: Database connection URL with credentials
    secret_type: database_credential
    severity: high
    confidence: 0.85
    validator: database
    pattern: '(?i)(?P<secret>(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis):\/\/[^\s:/@"''<>]+:[^\s@"''<>]+@[^\s"''<>;)]+)'
  - id: secret.generic-assignment
    priority: 10
    description: Credential-like variable assigned a literal password or secret
    secret_type: password
    severity: medium
    confidence: 0.6
    min_length: 6
    pattern: '(?im)(?<![\w-])["'']?(?P<variable>(?:[a-z0-9]+[_-])*(?:password|passwd|pwd|secret))["'']?[ \t]*[:=][ \t]*(?:(?P<quote>["''])(?P<secret>[^"''\r\n]*)(?P=quote)|(?P<bare_secret>[^\s"'',;#}\]]+))'
  - id: secret.generic-api-key
    priority: 10
    description: Potential API key assigned a literal value
    secret_type: api_key
    severity: high
    confidence: 0.7
    validator: token
    min_length: 20
    min_entropy: 3.5
    pattern: '(?im)(?<![\w-])["'']?(?P<variable>(?:[a-z0-9]+[_-])*(?:api[_-]?key))["'']?[ \t]*[:=][ \t]*(?:(?P<quote>["''])(?P<secret>[^"''\r\n]*)(?P=quote)|(?P<bare_secret>[^\s"'',;#}\]]+))'
  - id: secret.generic-token
    priority: 10
    description: Potential token assigned a literal value
    secret_type: token
    severity: medium
    confidence: 0.62
    validator: token
    min_length: 20
    min_entropy: 3.5
    pattern: '(?im)(?<![\w-])["'']?(?P<variable>(?:[a-z0-9]+[_-])*(?:token))["'']?[ \t]*[:=][ \t]*(?:(?P<quote>["''])(?P<secret>[^"''\r\n]*)(?P=quote)|(?P<bare_secret>[^\s"'',;#}\]]+))'
placeholders:
  - your_secret_here
  - your-api-key
  - your_api_key
  - replace-me
  - changeme
  - example
  - dummy
  - fake
  - sample
  - test-token
  - xxxxx
  - '<token>'
