[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yuanjian-agent"
version = "0.1.0"
description = "Task-aware static security auditing for open-source Python agents and MCP projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "YuanJian Agent Team" }]
dependencies = [
  "packaging>=26.3,<27",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
model = [
  "sentence-transformers>=6.1,<7",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
]

[project.scripts]
yuanjian = "yuanjian_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yuanjian_agent"]

[tool.hatch.build]
include = [
  "src/yuanjian_agent/**/*.py",
  "src/yuanjian_agent/templates/*.html",
  "src/yuanjian_agent/static/*.css",
  "src/yuanjian_agent/static/*.js",
  "src/yuanjian_agent/default_rules/*.yml",
  "src/yuanjian_agent/ui/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
